<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hockey365 — Матчи КХЛ и НХЛ, таблицы и результаты</title>
  <meta name="description" content="Сохранённые результаты и расписание матчей КХЛ и НХЛ, таблицы и статистика игроков. Статические данные могут устареть.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/logos/comp/KHL.svg">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SportsOrganization",
  "name": "Hockey365",
  "url": "https://newiziwavez33-hub.github.io/hockey365",
  "description": "Хоккейный портал сохранённых матчей, таблиц и статистики КХЛ и НХЛ",
  "sport": "Ice Hockey"
}
</script>
</head>
<body class="bg-surface-base antialiased min-h-screen">
  <a href="#main-content" class="skip-link">Перейти к основному контенту</a>

  <site-header></site-header>

  <main id="main-content" class="main-content pt-28">
    <div class="app-container">
      
      <!-- Stitch Highlight Banner: Match of the Day -->
      <div id="highlight-banner-slot"></div>

      <!-- 12-Column Responsive Layout Grid (8 cols stream, 4 cols right rail) -->
      <div class="layout-12-grid">
        <!-- Main Fixture Stream (8 cols) -->
        <section class="main-fixture-stream" aria-label="Матчи дня">
          <!-- Quick Filter Sub-toolbar -->
          <div class="stream-subtoolbar">
            <div id="subtoolbar-chips" class="subtoolbar-chips"></div>
            <div class="subtoolbar-sort">
              <span>Сортировка:</span>
              <span class="sort-val">По времени</span>
            </div>
          </div>

          <!-- Fixture Cards List -->
          <div id="matches-slot"></div>
        </section>

        <!-- Right Rail Widgets (4 cols) -->
        <aside class="sidebar-right-rail" aria-label="Новости, таблицы и статистика">
          <!-- WIDGET 1: Standings Leaders (Лидеры КХЛ) -->
          <div class="stitch-sidebar-card" id="sidebar-standings-card">
            <div class="sidebar-card-header">
              <div class="header-title-flex">
                <span class="material-symbols-outlined text-primary-cyan">leaderboard</span>
                <h3 class="sidebar-title">Лидеры КХЛ</h3>
              </div>
              <a href="competition/?id=KHL&tab=table" class="sidebar-header-link">
                <span>Таблица</span>
                <span class="material-symbols-outlined">arrow_forward</span>
              </a>
            </div>
            <div class="sidebar-card-body" id="sidebar-standings-slot"></div>
          </div>

          <!-- WIDGET 2: Hockey News Feed (Новости хоккея) -->
          <div class="stitch-sidebar-card" id="sidebar-news-card">
            <div class="sidebar-card-header">
              <div class="header-title-flex">
                <span class="material-symbols-outlined text-primary-cyan">feed</span>
                <h3 class="sidebar-title">Новости хоккея</h3>
              </div>
              <a href="news/" class="sidebar-header-link">
                <span>Все</span>
                <span class="material-symbols-outlined">arrow_forward</span>
              </a>
            </div>
            <div class="sidebar-card-body news-feed-body" id="sidebar-news-slot"></div>
          </div>

          <!-- WIDGET 3: Daily Match Analytics (Статистика дня) -->
          <div class="stitch-sidebar-card" id="sidebar-stats-card">
            <div class="sidebar-card-header">
              <div class="header-title-flex">
                <span class="material-symbols-outlined text-cyan-accent">analytics</span>
                <h3 class="sidebar-title">Статистика дня</h3>
              </div>
              <span class="sidebar-match-label font-label-sm" id="sidebar-stats-match-name">СКА vs Локо</span>
            </div>
            <div class="sidebar-card-body stats-body" id="sidebar-stats-slot"></div>
          </div>
        </aside>
      </div>

      <!-- Subtle Footer Disclaimer Line -->
      <div class="snapshot-footer-line">
        <span id="snapshot-notice" role="status" aria-live="polite">Показаны сохранённые матчи; прямой трансляции нет.</span>
      </div>

    </div>
  </main>

  <site-footer></site-footer>

  <script type="module">
    import './assets/js/components/site-header.js';
    import './assets/js/components/site-footer.js';
    import { initHomePage } from './assets/js/pages/home.js';

    initHomePage();

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW register error', err));
      });
    }
  </script>
</body>
</html>
