<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hockey365 — Матчи КХЛ и НХЛ, таблицы и результаты</title>
  <meta name="description" content="Сохранённые результаты и расписание матчей КХЛ и НХЛ, таблицы и статистика игроков. Статические данные могут устареть.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/logos/comp/KHL.svg">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SportsOrganization",
  "name": "Hockey365",
  "url": "https://newiziwavez33-hub.github.io/hockey365",
  "description": "Хоккейный портал сохранённых матчей, таблиц и статистики КХЛ и НХЛ",
  "sport": "Ice Hockey"
}
</script>
</head>
<body>
  <a href="#main-content" class="skip-link">Перейти к основному контенту</a>

  <site-header></site-header>

  <main id="main-content" class="main-content">
    <div class="app-container">
      
      <!-- Datepicker Ribbon -->
      <div id="datepicker-slot"></div>
      <p id="snapshot-notice" class="text-xs text-muted" role="status" aria-live="polite">Показаны сохранённые матчи; прямой трансляции нет.</p>

      <!-- Stitch Highlight Banner: Match of the Day -->
      <div id="highlight-banner-slot"></div>

      <!-- Filter Pills (Stitch Sub-toolbar) -->
      <div class="filter-subtoolbar">
        <div id="filter-pills" class="flex gap-8 items-center flex-wrap" role="group" aria-label="Фильтр матчей">
          <button class="tab-btn active" type="button" aria-pressed="true" data-filter="all">Все матчи</button>
          <button class="tab-btn flex items-center gap-6" type="button" aria-pressed="false" data-filter="live">
            <span class="live-dot-pulse"></span>
            <span>Только LIVE</span>
          </button>
          <button class="tab-btn" type="button" aria-pressed="false" data-filter="KHL">КХЛ</button>
          <button class="tab-btn" type="button" aria-pressed="false" data-filter="NHL">НХЛ</button>
        </div>
        <div class="sort-indicator text-xs text-muted">
          <span>Сортировка:</span>
          <span class="text-text-primary uppercase font-bold">По времени</span>
        </div>
      </div>

      <!-- Layout Grid: Main Matches Column (8 cols) + Sidebar (4 cols) -->
      <div class="layout-grid">
        <!-- Matches Column -->
        <section aria-label="Матчи дня">
          <div id="matches-slot"></div>
        </section>

        <!-- Sidebar (Stitch Right Rail) -->
        <aside aria-label="Новости и таблицы">
          <!-- Stitch Daily Match Stats Widget -->
          <div class="stitch-widget-card" id="sidebar-stats-card">
            <div class="card-header">
              <h2 class="card-title">
                <span class="material-symbols-outlined">analytics</span>
                <span>Статистика дня</span>
              </h2>
              <span class="text-xs text-muted" id="sidebar-stats-match-name"></span>
            </div>
            <div class="card-body" id="sidebar-stats-slot"></div>
          </div>

          <!-- Standings Preview Widget -->
          <div class="stitch-widget-card">
            <div class="card-header">
              <h2 class="card-title">
                <span class="material-symbols-outlined">leaderboard</span>
                <span>Лидеры КХЛ</span>
              </h2>
              <a href="competition/?id=KHL&tab=table" class="comp-table-link text-xs">Таблица →</a>
            </div>
            <div class="card-body" id="sidebar-standings-slot"></div>
          </div>

          <!-- News Widget -->
          <div class="stitch-widget-card">
            <div class="card-header">
              <h2 class="card-title">
                <span class="material-symbols-outlined">feed</span>
                <span>Новости хоккея</span>
              </h2>
              <a href="news/" class="comp-table-link text-xs">Все →</a>
            </div>
            <div class="card-body" id="sidebar-news-slot"></div>
          </div>
        </aside>
      </div>

    </div>
  </main>

  <site-footer></site-footer>

  <script type="module">
    import './assets/js/components/site-header.js';
    import './assets/js/components/site-footer.js';
    import { initHomePage } from './assets/js/pages/home.js';

    initHomePage();

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW register error', err));
      });
    }
  </script>
</body>
</html>
