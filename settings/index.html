<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройки — Тема, часовой пояс, экспорт | Hockey365</title>
  <meta name="description" content="Пользовательские настройки хоккейного портала Hockey365: светлая и тёмная темы, выбор часового пояса, импорт и экспорт избранного.">
  <link rel="icon" type="image/svg+xml" href="../assets/logos/comp/KHL.svg">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Перейти к основному контенту</a>

  <site-header></site-header>

  <main id="main-content" class="main-content">
    <div class="app-container" style="max-width: 680px;">

      <div class="card">
        <div class="card-header">
          <h1 class="card-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            Пользовательские настройки
          </h1>
        </div>
        <div class="card-body flex-col gap-16">
          <div id="settings-status" class="badge badge-live" style="display: none; padding: 8px 12px; font-size: 14px;"></div>

          <!-- Theme -->
          <div class="flex-col gap-6">
            <label for="theme-select" class="text-bold text-sm">Тема оформления интерфейса</label>
            <select id="theme-select" style="height: 40px; padding: 0 12px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-bg-secondary); color: var(--color-text-primary);">
              <option value="dark">Тёмная тема («Ледовая Арена»)</option>
              <option value="light">Светлая тема («Сталь и Лёд»)</option>
              <option value="auto">Как в операционной системе</option>
            </select>
          </div>

          <!-- Timezone -->
          <div class="flex-col gap-6">
            <label for="timezone-select" class="text-bold text-sm">Отображение времени матчей</label>
            <select id="timezone-select" style="height: 40px; padding: 0 12px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-bg-secondary); color: var(--color-text-primary);">
              <option value="Europe/Moscow">Московское время (UTC+3)</option>
              <option value="local">Местное время вашего браузера</option>
              <option value="UTC">UTC (Всемирное время)</option>
            </select>
          </div>

          <!-- Direct API key -->
          <div class="flex-col gap-6">
            <label for="custom-api-key" class="text-bold text-sm">Пользовательский API-ключ (опционально)</label>
            <input
              id="custom-api-key"
              type="password"
              placeholder="Введите ключ API-Sports или Highlightly..."
              style="height: 40px; padding: 0 12px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-bg-secondary); color: var(--color-text-primary);"
            />
            <span class="text-xs text-muted">Ключ хранится исключительно локально в вашем браузере (localStorage) и не передаётся на сервер.</span>
          </div>

          <!-- Export / Import -->
          <div class="flex-col gap-8" style="margin-top: 12px; border-top: 1px solid var(--color-border-subtle); paddingTop: 16px;">
            <div class="text-bold text-sm">Резервное копирование и перенос данных</div>
            <div class="flex gap-12 flex-wrap">
              <button id="export-settings-btn" class="btn-primary">Экспорт настроек и избранного</button>
              <label class="btn-primary" style="cursor: pointer; background: var(--color-bg-secondary); color: var(--color-text-primary); border: 1px solid var(--color-border);">
                Импорт настроек
                <input id="import-file-input" type="file" accept=".json" style="display: none;" />
              </label>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <site-footer></site-footer>

  <script type="module">
    import '../assets/js/components/site-header.js';
    import '../assets/js/components/site-footer.js';
    import { initSettingsPage } from '../assets/js/pages/settings.js';

    initSettingsPage();
  </script>
</body>
</html>
