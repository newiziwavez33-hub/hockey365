<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройки — Тема, часовой пояс, экспорт | Hockey365</title>
  <meta name="description" content="Пользовательские настройки хоккейного портала Hockey365: светлая и тёмная темы, выбор часового пояса, импорт и экспорт избранного.">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/hockey365.svg?v=1.8.2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css?v=1.8.2">
  <link rel="stylesheet" href="../assets/css/base.css?v=1.8.2">
  <link rel="stylesheet" href="../assets/css/components.css?v=1.8.2">
</head>
<body>
  <a href="#main-content" class="skip-link">Перейти к основному контенту</a>

  <site-header></site-header>

  <main id="main-content" class="main-content">
    <div class="app-container" style="max-width: 680px;">

      <div class="card">
        <div class="card-header">
          <h1 class="card-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            Пользовательские настройки
          </h1>
        </div>
        <div class="card-body flex-col gap-16">
          <div id="settings-status" role="status" aria-live="polite" class="badge badge-scheduled" style="display: none; padding: 8px 12px; font-size: 14px;"></div>

          <!-- Theme -->
          <div class="flex-col gap-6">
            <label for="theme-select" class="text-bold text-sm">Тема оформления интерфейса</label>
            <select id="theme-select" style="height: 40px; padding: 0 12px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-bg-secondary); color: var(--color-text-primary);">
              <option value="dark">Тёмная тема («Ледовая Арена»)</option>
              <option value="light">Светлая тема («Сталь и Лёд»)</option>
              <option value="auto">Как в операционной системе</option>
            </select>
          </div>

          <!-- Timezone -->
          <div class="flex-col gap-6">
            <label for="timezone-select" class="text-bold text-sm">Отображение времени матчей</label>
            <select id="timezone-select" style="height: 40px; padding: 0 12px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-bg-secondary); color: var(--color-text-primary);">
              <option value="Europe/Moscow">Московское время (UTC+3)</option>
              <option value="local">Местное время вашего браузера</option>
              <option value="UTC">UTC (Всемирное время)</option>
            </select>
          </div>

          <!-- Export / Import -->
          <div class="flex-col gap-8" style="margin-top: 12px; border-top: 1px solid var(--color-border-subtle); paddingTop: 16px;">
            <div class="text-bold text-sm">Резервное копирование и перенос данных</div>
            <div class="flex gap-12 flex-wrap">
              <button id="export-settings-btn" class="btn-primary">Экспорт настроек и избранного</button>
              <button id="import-settings-btn" type="button" class="btn-primary">Импорт настроек</button>
              <input id="import-file-input" type="file" accept=".json,application/json" aria-label="Файл настроек для импорта" hidden />
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <site-footer></site-footer>

  <script type="module">
    import '../assets/js/components/site-header.js?v=1.8.2';
    import '../assets/js/components/site-footer.js?v=1.8.2';
    import { initSettingsPage } from '../assets/js/pages/settings.js?v=1.8.2';

    initSettingsPage();
  </script>
</body>
</html>
