name: Scheduled Data Update

on:
  schedule:
    # Periodic publication of the official NHL snapshot.
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "data-update"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt

      - name: Fetch verified NHL data and rebuild indexes
        run: |
          python3 tools/adapters/nhl_web.py
          python3 tools/normalize.py
          python3 tools/validate_data.py
          python3 tools/build_search_index.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): auto-update hockey matches & standings [skip ci]"
            git push origin main
          fi
