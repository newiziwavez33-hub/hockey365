name: Scheduled Data Update

on:
  schedule:
    # Run every 5 minutes for near real-time updates
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt

      - name: Fetch verified NHL data and rebuild indexes
        run: |
          python3 tools/adapters/nhl_web.py
          # KHL is published only when its complete public feed validates.
          # A temporary KHL outage must not block the verified NHL snapshot.
          python3 tools/adapters/khl_aggregator.py || echo "KHL feed unavailable; KHL remains hidden"
          python3 tools/adapters/fetch_news.py
          python3 tools/normalize.py
          python3 tools/validate_data.py
          python3 tools/build_search_index.py
          python3 tools/build_sitemap.py
          python3 tools/build_static_pages.py

      - name: Commit & Push Changes
        id: commit_step
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(data): auto-update hockey matches & standings"
            git push origin main
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Pages
        if: steps.commit_step.outputs.has_changes == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.commit_step.outputs.has_changes == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.commit_step.outputs.has_changes == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
